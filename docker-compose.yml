name: notes

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5441}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notes -d notes']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
