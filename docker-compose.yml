name: notes

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5441}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notes -d notes']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      # The name is what a restore lists when it finds the database busy.
      DATABASE_URL: postgresql://notes:notes@db:5432/notes?application_name=notes-api
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      # Encrypts the secrets of two-step sign-in. The default is for trying
      # it out only: set your own (openssl rand -hex 32) and keep a copy
      # apart from the backups. A restored dump needs the same key, and a
      # stolen dump is no use without it. Empty turns two-step sign-in off.
      TWO_STEP_KEY: ${TWO_STEP_KEY-6c6f63616c2d646576656c6f706d656e742d6b65792d6368616e67652d6d6521}
      PORT: 4401
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      API_TOKEN_THROTTLE_LIMIT: ${API_TOKEN_THROTTLE_LIMIT:-120}
      # The page and the OpenAPI document at /api/docs. false turns both off.
      API_DOCS: ${API_DOCS:-true}
      PUBLIC_THROTTLE_LIMIT: ${PUBLIC_THROTTLE_LIMIT:-60}
      # Creates demo@example.com / demo-password with sample notes.
      SEED_DEMO: ${SEED_DEMO:-true}
      # Password reset mails. Unless told otherwise they go to the mailpit
      # service below. An empty SMTP_HOST switches mail off.
      SMTP_HOST: ${SMTP_HOST-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-Notes <notes@localhost>}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Mail needs TLS unless this says false. mailpit has no TLS, so the
      # default is "false" for as long as SMTP_HOST is left alone. With an
      # SMTP_HOST of your own the default turns into that host name, which
      # is not "false": a real server gets TLS without anyone having to
      # remember this line.
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-${SMTP_HOST-false}}
      # Where the links in those mails point.
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-5181}}
      # nginx in the web service is the one proxy in front of the API. With
      # this the throttles count per client, not once for everybody.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Pasted images and attached files, on the attachments volume below.
      ATTACHMENTS_DIR: /data/attachments
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-10}
      ATTACHMENT_ACCOUNT_MB: ${ATTACHMENT_ACCOUNT_MB:-500}
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${API_PORT:-4401}:4401'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4401/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-5181}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5

  # Catches the mail the API sends and shows it at http://localhost:8041.
  # Nothing is delivered. The SMTP port stays inside the compose network, and
  # the web page is bound to this machine only: whoever can read it can open
  # every password reset link.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8041}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional, start it with: docker compose --profile backup up -d
  # Dumps the database once a day into BACKUP_DIR and keeps the newest
  # BACKUP_KEEP dumps. See "Backup and restore" in the README.
  backup:
    # postgres:17-alpine with age, curl and the tools of the copy command.
    build:
      context: ./scripts
      dockerfile: backup.Dockerfile
      args:
        COPY_PACKAGES: ${BACKUP_COPY_PACKAGES:-rsync openssh-client}
    profiles: [backup]
    entrypoint: ['sh', '/scripts/backup.sh']
    environment:
      PGHOST: db
      PGUSER: notes
      PGPASSWORD: notes
      PGDATABASE: notes
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # The files of attachments, archived beside each dump and put back with it.
      ATTACHMENTS_DIR: /attachments
      # All optional, see "Encryption, copies and alerts" in the README.
      BACKUP_ENCRYPT_TO: ${BACKUP_ENCRYPT_TO:-}
      BACKUP_COPY_COMMAND: ${BACKUP_COPY_COMMAND:-}
      BACKUP_COPY_TIMEOUT_SECONDS: ${BACKUP_COPY_TIMEOUT_SECONDS:-3600}
      BACKUP_ALERT_URL: ${BACKUP_ALERT_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      # Written to only by a restore, which refuses to run while the API does.
      - attachments:/attachments
    # Unhealthy once the last good dump is more than a day and two hours old.
    healthcheck:
      test: ['CMD', 'sh', '/scripts/backup.sh', 'health']
      interval: 5m
      timeout: 10s
      start_period: 10m
      start_interval: 30s

volumes:
  db-data:
  attachments:
