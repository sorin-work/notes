server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Imports can be a zip of a whole vault; the API allows 20 MB per file.
  client_max_body_size 50m;

  # The browser only talks to this container; /api is passed on to the API
  # service, so no CORS setup is needed.
  location /api/ {
    proxy_pass http://api:4401;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A backup is restored from any size: the API reads it as it comes in and
  # checks it on the way. So nginx passes it on as it arrives too, without a
  # size limit, and waits as long as a large restore takes.
  location = /api/import/backup {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://api:4401;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Vite fingerprints everything under /assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The app shell, the service worker and the manifest keep their names from
  # one build to the next, so the browser has to ask every time. That is
  # how an installed app learns that there is a new version.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /version.json {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Client-side routes, including /s/<token> share links, serve the app shell.
  location / {
    try_files $uri /index.html;
  }
}
