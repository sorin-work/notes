# Headers for everything nginx serves itself: the app shell, its files, the
# service worker and the manifest. Included by every location in nginx.conf
# that is not under /api/, because nginx drops the add_header lines of the
# server block in any location that sets one of its own. The API sets its own
# headers, so these never go on /api/.
#
# `always` keeps them on error answers too, a 404 from /assets/ among them.
#
# Scripts, styles, fonts and requests come from this host only. Images may
# also be blob: and data: (a pasted image before its upload is done) and come
# from any https: site, because notes can show images from the web.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# The address of a /s/<token> page is the share link itself, and every other
# page names a note. Neither should go to the sites a note links to.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
